schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Workflow/BPM platform in TypeScript. The product is the engine plus its
  browser UI (`packages/web`), whose four areas serve the participant, the
  operator, the developer and the process owner. The engine itself stays
  headless and API-first behind that UI: it carries no UI dependency, and
  `packages/web` reaches it only over the HTTP wrapper and the exports map.
  Keep that boundary. Direction: no-code and low-code process authoring
  (ROADMAP stage 27). No-code is the target for what the builders cover, and
  low-code is what stays underneath permanently — the JSON view, the CEL
  input and hand-authored bodies stay first-class. Every authoring surface
  produces the same JSON definition as today, so none of them relaxes a
  contract rule.

  Paradigm: state-based
  finite-state machine — Steps (states) joined by explicit Paths (transitions),
  NOT BPMN token flow. v1: one active step per instance (no parallelism);
  subprocesses are synchronous call-and-return.

  The contract is one artifact: the serialized JSON process definition.
  src/schema/definition.ts IS the contract — Zod schemas with TS types via
  z.infer, so validation and types cannot drift. Identity is an opaque,
  type-prefixed, immutable `id` (the sole reference anchor); `key` is a mutable
  slug that references nothing; `label` is display text. All conditions are CEL
  ({ lang: "cel", src }): pure, total, no now(). Authoring-time invariants are Zod
  refinements or write-path checks in src/schema/compile.ts — placement follows
  two criteria: an invariant a hand-written body must not bypass belongs on the
  write path, and one whose violation cannot exist in an already-published body
  may live in the schema. Each ships with a test that rejects a violating
  definition.
  Change the schema deliberately, never as a side effect of another task.

  Stack: TypeScript strict, ESM. Bun is the runtime, package manager (`bun
  install`), and test runner (`bun test`); typecheck via `tsc --noEmit`. Datastore
  is PostgreSQL, accessed via Bun's native `Bun.sql`. Tooling runs in the
  devcontainer (Node 22 base + Bun, plus a Postgres 16 service).

  Process: spec-driven via OpenSpec. Every non-trivial change goes through an
  OpenSpec change (propose -> specs/tasks -> implement -> verify -> archive),
  never a direct edit.

  Beyond the engine, a Bun workspace (`packages/*`) adds two browser
  packages. `packages/web` is the ONE package that produces a bundle: one
  build, one login, one session, one address, which the engine serves from
  `WEB_ROOT`. Its `src/shell/` owns prefix routing, the session, the login
  screen, the error boundary and the header's account menu with the area
  switcher; `src/api/` and `src/i18n/` hold what every area shares; and
  `src/areas/{app,admin,studio,reporting}/` hold the four audiences, each
  with one URL prefix, one lazy chunk and one role gate. An area never
  imports from another area — only upward into `shell/`, `api/`, `i18n/`.
  The studio area is Process Studio, the developer's product: server-persisted
  drafts (the `drafts` table, optimistic concurrency on a `revision` column),
  a canvas-primary edit screen (drag-to-move, drag-to-connect) with a
  selection-driven inspector beside a routed panels screen holding the four
  process-wide views (field catalog, data sources, contract, field matrix),
  a routed form editor, a replacing JSON surface, publish,
  published versions with a JSON diff, migration-plan authoring, a
  registry/CEL-scratchpad Tools screen, a Player beside the merged
  instance record, and a Templates screen holding the reusable bodies a new
  process seeds from; gated by `system:author` or `system:developer`, with
  migration-plan authoring and the Tools screen behind `system:developer`
  alone and the Templates screen behind `system:templates`. The admin area is the
  operator's product — all-instances list, merged transition/event record
  with cancel, outbox with dead-letter retry/discard, pending timers, user
  administration, data list maintenance, the UI-strings override screen;
  gated by `system:admin` or, for the
  data list screens alone, `system:datalists`. The app area is participant-facing
  (My-tasks inbox / Task / Start-a-process over `scope=mine`-derived inbox
  filtering and JWT auth). The reporting area is the process owner's — cycle
  time, bottlenecks, SLA; gated by `system:reports`. `packages/form-ui` is a
  source-only, no-build field-form renderer shared by the studio area's Player
  and the app area, so what an author previews is what a participant gets; it
  stays its own package. Both reach the engine only through the HTTP wrapper
  or the engine package's `exports` map — neither authors-or-runs definitions
  in-process except via those boundaries. `packages/editor`, the original
  structural-editor proof of concept, is deleted.

  `src/runtime/api.ts` (the Runtime API Layer) is the in-process boundary
  that actually runs an instance — `createProcessInstance`,
  `getInstanceView`, `submitAndTransition`, `claimStep`/`releaseClaim`,
  `listInstances`/`getInstanceRecord` — validating and writing
  user-submitted data (nothing else in the engine does). `src/http/` wraps
  it as `http-wrapper`, with one route module per surface beside
  `routes.ts` — admin, studio, reporting, account and UI strings;
  JWT/local-account auth (`jwt-authentication`,
  `local-user-accounts`) and role-gated operations (`authorization`:
  `system:publish`, `system:cancel-any`, `system:admin`, `system:developer`,
  `system:author`, `system:reports`, `system:datalists`, `system:templates` —
  eight flat roles, none implying another)
  sit in front of it. Actions, data sources and assignment strategies are
  plugins behind `{ type, config }`, each resolved and config-checked at
  publish against its own registry in `src/engine/registry.ts`. All of this is built — nothing here is still "post-v1
  roadmap"; see `ROADMAP.md` for current stage-by-stage status.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  design:
    - Include "Migration Plan" and "Open Questions" sections in addition to
      the base Context / Goals-Non-Goals / Decisions / Risks-Trade-offs
      template — established convention across this repo's design docs.
  tasks:
    - End with a "Verification" group whose tasks run `bun run typecheck`
      and the FULL `bun test` suite with DATABASE_URL set — never rely on a
      single-file rerun (DB-backed suites share one database and contend
      when run back-to-back in isolation; see CLAUDE.md).
