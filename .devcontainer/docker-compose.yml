# Devcontainer services: the `app` container (Node 22 base + Bun), a PostgreSQL
# 16 datastore, a Mailpit SMTP catcher, and a webhook sink. The engine reaches
# Postgres via DATABASE_URL (see openspec/specs persistence), Mailpit via
# SMTP_HOST/PORT (notification-email-action-handler), and the sink via
# HTTP_ACTION_ALLOWED_HOSTS (give-the-example-a-reachable-target). pgdata
# persists the database across rebuilds; caught mail and received webhooks are
# deliberately not persisted.
name: workflow-engine

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/workflow_engine
      # The one frontend dev server, pinned to its own port (see
      # pin-frontend-dev-ports, consolidate-frontend-shell): packages/web
      # on 5173.
      # Unset means the HTTP wrapper emits no CORS headers at all.
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # No AUTH_JWT_SECRET / AUTH_ISSUERS in this container, so the server
      # would otherwise refuse to start. This flag is the explicit, written-down
      # opt-in for that: it disables authentication entirely, trusting
      # X-Actor-Id / X-Actor-Roles headers verbatim. Devcontainer only — never
      # set this in a deployment that real user data reaches.
      ALLOW_INSECURE_DEV_AUTH: "1"
      # Mailpit's SMTP listener: no auth, no TLS. The notification.email
      # handler's end-to-end test skips when SMTP_HOST is unset, the same way
      # the DB-backed suites skip without DATABASE_URL.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: workflow-engine@example.test
      # The http.request handler's egress policy (restrict-http-action-egress).
      # Unset denies every outbound action target, so without an entry here the
      # dev server reaches nothing at all. webhook-sink:8080 is the sink
      # service below, the target examples/expense-approval.json's `book` and
      # `escalated_review` steps both name. A change that points an example or
      # a script at a new host adds it here in the same commit.
      HTTP_ACTION_ALLOWED_HOSTS: webhook-sink:8080
      # The sink speaks plain HTTP, which the https: rule would otherwise
      # refuse. Devcontainer only, like ALLOW_INSECURE_DEV_AUTH.
      HTTP_ACTION_ALLOW_INSECURE: "1"
    depends_on:
      - db
      - mailpit
      - webhook-sink
    # Proves the runtime answers and nothing more — this container runs no
    # service of its own (see add-devcontainer-preflight).
    healthcheck:
      test: ["CMD", "bun", "--version"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workflow_engine
    # Runtime GUC override, not an initdb-time default: takes effect on every
    # start regardless of when the pgdata volume was first initialized. Every
    # timestamp column is timestamptz (src/engine/store.ts), stored as an
    # absolute UTC instant either way — this changes only how the server logs
    # and untyped-timestamp casts display, never what's stored.
    command: ["postgres", "-c", "log_timezone=Europe/Zurich", "-c", "timezone=Europe/Zurich"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Catches every message the notification.email handler sends. Port 1025 is
  # SMTP, 8025 the web interface — the host binding for the latter lives in
  # docker-compose.override.yml, like every other published port.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    # The image already ships this exact check (CMD /mailpit readyz) as its
    # own HEALTHCHECK; declared here too so the guarantee lives in the
    # tracked compose file rather than only in an upstream image detail.
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Answers every http.request delivery with 200 and echoes the JSON body it
  # received, so book's and escalated_review's actions in
  # examples/expense-approval.json reach a target that answers
  # (give-the-example-a-reachable-target). Runs the same image the app
  # service builds — compose has no build inheritance, so the block repeats —
  # plus scripts/dev-webhook-sink.ts. Declares no ports entry, matching db
  # and mailpit; a contributor who wants to reach it from the host publishes
  # the port in their own gitignored docker-compose.override.yml.
  webhook-sink:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    command: bun run scripts/dev-webhook-sink.ts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
