# Devcontainer services: the `app` container (Node 22 base + Bun) and a PostgreSQL
# 16 datastore. The engine reaches Postgres via DATABASE_URL (see openspec/specs
# persistence). pgdata persists the database across rebuilds.
name: workflow-engine

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/workflow_engine
      # The three frontend dev servers, each pinned to its own port (see
      # pin-frontend-dev-ports): app 5173, admin 5174, studio 5175.
      # Unset means the HTTP wrapper emits no CORS headers at all.
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175
      # No AUTH_JWT_SECRET / AUTH_ISSUERS in this container, so the server
      # would otherwise refuse to start. This flag is the explicit, written-down
      # opt-in for that: it disables authentication entirely, trusting
      # X-Actor-Id / X-Actor-Roles headers verbatim. Devcontainer only — never
      # set this in a deployment that real user data reaches.
      ALLOW_INSECURE_DEV_AUTH: "1"
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workflow_engine
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
