# Devcontainer services: the `app` container (Node 22 base + Bun), a PostgreSQL
# 16 datastore, and a Mailpit SMTP catcher. The engine reaches Postgres via
# DATABASE_URL (see openspec/specs persistence) and Mailpit via SMTP_HOST/PORT
# (notification-email-action-handler). pgdata persists the database across
# rebuilds; caught mail is deliberately not persisted.
name: workflow-engine

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/workflow_engine
      # The three frontend dev servers, each pinned to its own port (see
      # pin-frontend-dev-ports): app 5173, admin 5174, studio 5175.
      # Unset means the HTTP wrapper emits no CORS headers at all.
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # No AUTH_JWT_SECRET / AUTH_ISSUERS in this container, so the server
      # would otherwise refuse to start. This flag is the explicit, written-down
      # opt-in for that: it disables authentication entirely, trusting
      # X-Actor-Id / X-Actor-Roles headers verbatim. Devcontainer only — never
      # set this in a deployment that real user data reaches.
      ALLOW_INSECURE_DEV_AUTH: "1"
      # Mailpit's SMTP listener: no auth, no TLS. The notification.email
      # handler's end-to-end test skips when SMTP_HOST is unset, the same way
      # the DB-backed suites skip without DATABASE_URL.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: workflow-engine@example.test
    depends_on:
      - db
      - mailpit
    # Proves the runtime answers and nothing more — this container runs no
    # service of its own (see add-devcontainer-preflight).
    healthcheck:
      test: ["CMD", "bun", "--version"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workflow_engine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Catches every message the notification.email handler sends. Port 1025 is
  # SMTP, 8025 the web interface — the host binding for the latter lives in
  # docker-compose.override.yml, like every other published port.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    # The image already ships this exact check (CMD /mailpit readyz) as its
    # own HEALTHCHECK; declared here too so the guarantee lives in the
    # tracked compose file rather than only in an upstream image detail.
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
