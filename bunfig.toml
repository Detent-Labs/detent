# Test-runner config. The preload points `bun test` at its own database
# (`<name>_test`), so a run cannot collide with `bun run serve`'s background
# pollers, a seed, or a browser session against the devcontainer's Postgres.
# See test/preload-db.ts for the measurement behind it.
[test]
preload = ["./test/preload-db.ts", "./test/preload-stylex.ts"]
