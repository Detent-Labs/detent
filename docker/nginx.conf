# Shared across app/admin/studio. Replaces the base image's own default
# server block entirely, so every directive below is load-bearing -- none
# of it is an implied default once this file takes over.
server {
    # nginxinc/nginx-unprivileged's own convention: its non-root user
    # cannot bind a port under 1024, so this is not just a style choice.
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;

    # SPA fallback: each package routes client-side via a hand-written
    # History API hook, so a direct load of a deep URL (for example
    # /processes/abc/edit) must still resolve to index.html.
    location / {
        try_files $uri /index.html;
    }
}
