openapi: 3.0.3
info:
  title: "Workflow/BPM Engine: Runtime API"
  version: "1.0.0"
  description: >-
    The customer-facing HTTP surface of the workflow/BPM engine: login,
    process publish/list/versions, and the full instance lifecycle
    (create, view, submit, claim/release/delegate, comment, attach a
    file, cancel, and the audit record), plus the caller's own account.
    Excludes `admin/*`, `drafts/*`,
    `migration-plans/*`, `reporting/*`,
    and `registry`, which serve the operator, developer and process-owner
    areas of `packages/web`
    frontends directly, not a customer integration. Each exclusion is named
    rather than left implicit, so its absence reads as a decision.

    Every route runs through the Runtime API Layer (`src/runtime/api.ts`).
    An unauthenticated request to any route below `POST /auth/login`,
    `GET /livez`, `GET /readyz`, and `GET /ui-strings` gets 401.
    `GET /metrics` is also 401
    without a token, but its token is `METRICS_TOKEN`, not an actor's JWT.
    A request lacking a required
    reserved role gets 403. A malformed request body gets 400 (request
    shape) or 422 (field-level validation).


    Every JSON envelope this API returns carries `Cache-Control: no-store`.
servers:
  - url: /
    description: Path-relative — point this at the deployment's own origin.
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Login and token issuance.
  - name: processes
    description: Publish and discover process definitions.
  - name: instances
    description: Create, drive, and read process instances.
  - name: account
    description: The caller's own account. Needs a token, no role.
  - name: health
    description: Unauthenticated liveness/readiness probes for orchestration.
  - name: observability
    description: Unauthenticated Prometheus scrape target.
  - name: ui-strings
    description: Unauthenticated read of a deployment's own UI wording.

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with email and password
      description: >-
        Registered only when `AUTH_JWT_SECRET` is set. Returns an 8-hour
        JWT. Repeated failed attempts for one email are rate-limited
        before the credential check runs.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Request body is not valid JSON, or is missing `email`/`password`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unknown email, wrong password, or a disabled account. One generic message for all three, by design.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many failed attempts for this email within the rate-limit window. No other route in this document returns 429.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /processes:
    post:
      tags: [processes]
      operationId: publishProcess
      summary: Publish a process definition
      description: Requires the `system:publish` role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "200":
          description: Published (or, on an identical re-publish, the existing version, hash-idempotent).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResponse"
        "400":
          description: Request body is not valid JSON, or is missing `processId`/`body`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: No actor could be resolved from the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The actor lacks the `system:publish` role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: The definition fails schema, CEL, registry, or cross-process validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuesErrorEnvelope"
        "500":
          description: An unrecognized server-side failure. Body carries no message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags: [processes]
      operationId: listProcesses
      summary: List every process with at least one published version
      description: No reserved-role requirement. Each entry describes that process's newest published version.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcessSummary"
        "401":
          description: No actor could be resolved from the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /processes/{processId}/versions:
    get:
      tags: [processes]
      operationId: listProcessVersions
      summary: List published versions of one process
      description: No reserved-role requirement.
      parameters:
        - $ref: "#/components/parameters/processId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VersionSummary"
        "401":
          description: No actor could be resolved from the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /processes/{processId}/instances:
    post:
      tags: [instances]
      operationId: createInstance
      summary: Create an instance of a process
      description: No reserved-role requirement. Omit `version` to use the latest published version.
      parameters:
        - $ref: "#/components/parameters/processId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstanceRequest"
      responses:
        "201":
          description: Created (and run to rest — an all-automatic path from the initial step, if any, has already fired).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          description: Request body is not valid JSON, or does not match the expected shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: No actor could be resolved from the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Seed `data` fails field-level validation against the initial step.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuesErrorEnvelope"
        "500":
          description: The process, or the requested version, has no published body. Also covers any unrecognized server-side failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /instances:
    get:
      tags: [instances]
      operationId: listInstances
      summary: List instances
      description: >-
        `scope=mine` is open to any authenticated actor and is derived
        from that actor's id/roles. `scope=started` is open to any
        authenticated actor too, and is derived from that actor's id.
        `scope=all`, and an omitted `scope` alike, require the
        `system:admin` role.
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [mine, started, all]
          description: Omitted means `all`.
        - name: processId
          in: query
          schema:
            type: string
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/InstanceStatus"
        - name: currentStepId
          in: query
          schema:
            type: string
        - name: startedBy
          in: query
          schema:
            type: string
          description: Rejected (400) when combined with `scope=started`.
        - name: claimedBy
          in: query
          schema:
            type: string
        - name: assignedTo
          in: query
          schema:
            type: string
          description: Rejected (400) when combined with `scope=mine`.
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSummaryPage"
        "400":
          description: >-
            An invalid `limit`/`status` value, `scope=mine` combined with
            `assignedTo`, or `scope=started` combined with `startedBy`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: No actor could be resolved from the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: "`scope=all` (or an omitted `scope`) without the `system:admin` role."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /instances/{instanceId}:
    get:
      tags: [instances]
      operationId: getInstanceView
      summary: Resolve a display-ready view of one instance
      description: >-
        No reserved-role requirement. Visible to `system:admin`, the
        instance's starter, the current step's claimant, or an eligible
        assignment candidate.
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceView"
        "401":
          description: No actor could be resolved from the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The actor is neither admin, starter, claimant, nor an eligible candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: The instance does not exist. Also covers any unrecognized server-side failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /instances/{instanceId}/submit:
    post:
      tags: [instances]
      operationId: submitInstance
      summary: Submit field data and trigger a manual transition
      description: No reserved-role requirement; the claimant, or an eligible candidate on an unclaimed step, may submit.
      parameters:
        - $ref: "#/components/parameters/instanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRequest"
      responses:
        "200":
          description: >-
            The updated instance. On an automatic-cascade loop
            (`AutomaticCascadeLoop`) this is still 200: the submit and
            transition already committed, and the body is the resulting
            (now-`faulted`) view, not an error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          description: Request body is not valid JSON, or does not match the expected shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: No actor could be resolved from the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The actor is not the claimant, or not an eligible candidate on an unclaimed step.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The named path's guard refused the transition, the instance is not running, or a concurrent write lost the optimistic-concurrency race.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Submitted `data` fails field-level validation against the current step.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuesErrorEnvelope"

  /instances/{instanceId}/claim:
    post:
      tags: [instances]
      operationId: claimInstance
      summary: Claim the instance's current step
      description: No reserved-role requirement; the actor must be an eligible, unclaimed candidate.
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "401":
          description: No actor could be resolved from the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The actor is not an eligible candidate, or the step is already claimed by someone else.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The instance is not running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /instances/{instanceId}/release:
    post:
      tags: [instances]
      operationId: releaseInstance
      summary: Release the current claim on the instance's current step
      description: No reserved-role requirement; the actor must hold the current claim.
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "401":
          description: No actor could be resolved from the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The actor is not the step's current claimant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The instance is not running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /instances/{instanceId}/delegate:
    post:
      tags: [instances]
      operationId: delegateInstance
      summary: Delegate the current claim to another actor
      description: >-
        No reserved-role requirement; the actor must hold the current
        claim. The delegate becomes the new claimant without joining the
        permanent candidate pool.
      parameters:
        - $ref: "#/components/parameters/instanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelegateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          description: Request body is not valid JSON, or is missing `toActorId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: No actor could be resolved from the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The actor is not the step's current claimant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The instance is not running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /instances/{instanceId}/comments:
    post:
      tags: [instances]
      operationId: postInstanceComment
      summary: Post a comment on an instance
      description: >-
        No reserved-role requirement; the same participant-visibility
        rule as `GET /instances/{instanceId}` governs who may post.
        Visible independent of claim state. `text` is capped at 10,000
        characters.
      parameters:
        - $ref: "#/components/parameters/instanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceComment"
        "400":
          description: Request body is not valid JSON, is missing `text`, or `text` is empty or over 10,000 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: No actor could be resolved from the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The actor is neither admin, starter, claimant, nor an eligible candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: The instance does not exist. Also covers any unrecognized server-side failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags: [instances]
      operationId: listInstanceComments
      summary: List comments on an instance, oldest first
      description: Same participant-visibility rule as posting a comment.
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceCommentPage"
        "400":
          description: An invalid `limit` value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: No actor could be resolved from the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The actor is neither admin, starter, claimant, nor an eligible candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: The instance does not exist. Also covers any unrecognized server-side failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /instances/{instanceId}/attachments:
    post:
      tags: [instances]
      operationId: uploadInstanceAttachment
      summary: Upload a file attachment to an instance
      description: >-
        No reserved-role requirement; the same participant-visibility
        rule as `GET /instances/{instanceId}` governs who may upload.
        Visible independent of claim state. `dataBase64` is the file's
        bytes, base64-encoded — there is no multipart upload path.
        `filename`/`contentType` are capped at 255 characters each; the
        decoded payload is capped at `MAX_ATTACHMENT_BYTES`
        (environment-configured, default 5 MB; a value that is not a
        positive integer stops the process at startup).
        `contentType` must be one MIME type and subtype joined by `/`,
        each half drawn from letters, digits and `.`, `+`, `-`, `_`.
        Parameters do not pass: send `text/plain`, not
        `text/plain; charset=utf-8`.
      parameters:
        - $ref: "#/components/parameters/instanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentUploadRequest"
      responses:
        "201":
          description: Created. The response body never carries the file's bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceAttachment"
        "400":
          description: >-
            Request body is not valid JSON; is missing `filename`,
            `contentType`, or `dataBase64`; `filename`/`contentType`
            exceeds 255 characters; `contentType` is outside the MIME
            token pair; or the decoded payload exceeds
            `MAX_ATTACHMENT_BYTES`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: No actor could be resolved from the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The actor is neither admin, starter, claimant, nor an eligible candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: The instance does not exist. Also covers any unrecognized server-side failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags: [instances]
      operationId: listInstanceAttachments
      summary: List an instance's attachments, oldest first
      description: >-
        Same participant-visibility rule as uploading. Metadata only —
        no item carries the file's bytes; fetch those from
        `GET /instances/{instanceId}/attachments/{attachmentId}`.
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceAttachmentPage"
        "400":
          description: An invalid `limit` value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: No actor could be resolved from the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The actor is neither admin, starter, claimant, nor an eligible candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: The instance does not exist. Also covers any unrecognized server-side failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /instances/{instanceId}/attachments/{attachmentId}:
    get:
      tags: [instances]
      operationId: downloadInstanceAttachment
      summary: Download one attachment's raw bytes
      description: >-
        Same participant-visibility rule as uploading. Unlike every
        other route in this document, a successful response is not a
        JSON envelope: the body is the raw file, with `Content-Type`
        set to the attachment's stored `contentType`. The response also
        carries `Content-Disposition: attachment` and
        `X-Content-Type-Options: nosniff`, so an uploaded HTML or SVG
        file saves rather than running as a document on this origin.
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/attachmentId"
      responses:
        "200":
          description: OK. The raw file bytes, not a JSON envelope.
          headers:
            Content-Disposition:
              description: >-
                Always `attachment`. The `filename` parameter holds the
                stored filename, percent-encoded.
              schema:
                type: string
            X-Content-Type-Options:
              description: Always `nosniff`.
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          description: No actor could be resolved from the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The actor is neither admin, starter, claimant, nor an eligible candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: >-
            The attachment does not exist, or belongs to a different
            instance than `instanceId`. Also covers any unrecognized
            server-side failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /instances/{instanceId}/cancel:
    post:
      tags: [instances]
      operationId: cancelInstance
      summary: Cancel a running instance
      description: >-
        Requires the `system:cancel-any` role, or that the actor started
        the instance (`startedBy === actor.id`).
      parameters:
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: OK. A no-op (still 200) on an instance that is not running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "401":
          description: No actor could be resolved from the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The actor holds neither `system:cancel-any` nor starter status on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /instances/{instanceId}/record:
    get:
      tags: [instances]
      operationId: getInstanceRecord
      summary: Read the merged transition/event audit record of an instance
      description: >-
        Requires the `system:admin` role, or `system:developer` together
        with `startedBy === actor.id` (a developer may read the record of
        an instance their own Player session created).
      parameters:
        - $ref: "#/components/parameters/instanceId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceRecordPage"
        "400":
          description: An invalid `limit` value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: No actor could be resolved from the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The actor holds neither `system:admin` nor `system:developer` plus starter status on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /account/me:
    get:
      tags: [account]
      operationId: getAccount
      summary: Read the caller's own account
      description: >-
        Needs a token and no role: any resolvable session reaches it. The
        route takes no id and scopes to the resolved actor alone, so no
        caller can name another account.


        An actor whose id matches a local account gets `editable: true`
        and the full record. An actor whose id matches none gets
        `{ id, roles, editable: false }` and the same `200`. A locally
        issued token guarantees an active local account, so a missing one
        names an externally issued identity rather than an error. This
        route returns no `404` to a resolvable actor.
      responses:
        "200":
          description: The caller's own account, or their identity alone.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LocalAccount"
                  - $ref: "#/components/schemas/FederatedAccount"
        "401":
          description: No actor could be resolved from the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags: [account]
      operationId: updateAccount
      summary: Change the caller's own display name and locale
      description: >-
        Needs a token and no role, and scopes to the resolved actor the
        same way the read does.


        The body carries `displayName` and `locale`, each optional; an
        omitted field is left as it stands. Any other key is refused with
        `400` rather than ignored. A `displayName` of `null` clears the
        stored name, so the resolved value falls back to the email.


        Password self-service is not part of this route, or of any other.
        Setting a password stays a CLI operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: The updated account, in the shape the read returns for a local account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalAccount"
        "400":
          description: >-
            A key outside `displayName`/`locale`, a `displayName` that is
            empty after trimming or longer than 200 characters, or a
            `locale` outside the supported set. No column changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: No actor could be resolved from the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The actor's id matches no local account, so there is nothing to change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /livez:
    get:
      tags: [health]
      operationId: livez
      summary: Liveness probe
      description: Unconditional. No auth, no CORS handling.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      tags: [health]
      operationId: readyz
      summary: Readiness probe
      description: "A `SELECT 1` database ping. No auth, no CORS handling."
      security: []
      responses:
        "200":
          description: The database is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: The database ping failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /ui-strings:
    get:
      tags: [ui-strings]
      operationId: uiStrings
      summary: Read this deployment's UI-wording overrides
      description: >-
        Needs no role and no token. The browser bundle fetches this before
        its first render, so the login screen carries an override too, and
        no token exists at that point.


        Returns wording alone: a heading, a button label, a sentence of
        empty-state prose, each keyed by the frontend area, the locale and
        the catalog key it replaces. It reads one table, and that table
        holds no account, instance, process or definition data. It reads
        that table whole, so the answer never varies by caller.


        A key with no override is absent from the map, and the frontend
        then renders the wording it ships. `PUT /admin/ui-strings` writes
        an override and sits outside this document, under the `admin/*`
        exclusion.
      security: []
      responses:
        "200":
          description: Every stored override, as one nested map.
          content:
            application/json:
              schema:
                type: object
                required: [overrides]
                properties:
                  overrides:
                    type: object
                    description: >-
                      Area, then locale, then catalog key. Empty when the
                      deployment has overridden nothing.
                    additionalProperties:
                      type: object
                      additionalProperties:
                        type: object
                        additionalProperties:
                          type: string
                example:
                  overrides:
                    shell:
                      en:
                        login.title: Sign in to Acme

  /metrics:
    get:
      tags: [observability]
      operationId: metrics
      summary: Prometheus scrape target
      description: >-
        Computed fresh from the database on every request, no in-process
        aggregation. No CORS handling. Three gauges:
        `workflow_outbox_backlog{status}`, `workflow_timer_overdue_count`,
        `workflow_timer_lag_seconds`, and `workflow_instances_faulted`.


        Conditional on `METRICS_TOKEN`. When that variable is unset or
        empty the route is not registered at all, and a scrape gets the
        ordinary unmatched-path answer. When it holds a value, the scrape
        sends it as a bearer token, compared in constant time; a missing
        or mismatched token is `401` and runs no query. This token is not
        the JWT the rest of the document's `bearerAuth` describes.
      security:
        - metricsToken: []
      responses:
        "200":
          description: OK. Prometheus text-exposition format, not a JSON envelope.
          content:
            "text/plain; version=0.0.4; charset=utf-8":
              schema:
                type: string
        "401":
          description: >-
            The request carried no bearer token, or one that does not
            match `METRICS_TOKEN`. No query runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: A query against the database failed. Empty body.
          content:
            "text/plain; version=0.0.4; charset=utf-8":
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A token this engine issued, or one from a configured external issuer.
        In a multi-tenant deployment an engine-issued token also carries a
        `tenant` claim, naming the tenant whose data the request reaches;
        `POST /auth/login` mints it from the host the login arrived on. A
        single-tenant deployment issues no such claim and ignores one.
    metricsToken:
      type: http
      scheme: bearer
      description: >-
        The shared value of `METRICS_TOKEN`, sent by the scraper. Not a
        JWT and not an actor: a scrape carries no identity, so this
        endpoint resolves none.

  parameters:
    processId:
      name: processId
      in: path
      required: true
      schema:
        type: string
    instanceId:
      name: instanceId
      in: path
      required: true
      schema:
        type: string
    attachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
      description: A non-positive-integer value is rejected with 400.
    cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: An opaque page cursor returned by a previous call.

  schemas:
    Actor:
      type: object
      properties:
        id:
          type: string
        roles:
          type: array
          items:
            type: string
      required: [id, roles]

    InstanceStatus:
      type: string
      enum: [running, completed, cancelled, faulted]

    LocalizedText:
      type: object
      description: "Locale code (e.g. `en`, `de-CH`) to display string."
      additionalProperties:
        type: string

    AssignmentState:
      type: object
      properties:
        candidates:
          type: array
          items:
            type: string
        claimedBy:
          type: string
        claimedAt:
          type: string
          format: date-time
      required: [candidates]

    Instance:
      type: object
      properties:
        instanceId:
          type: string
        processId:
          type: string
        version:
          type: integer
        definitionHash:
          type: string
        currentStepId:
          type: string
        transitionSeq:
          type: integer
        data:
          type: object
          additionalProperties: true
          description: Flat, keyed by field id.
        assignment:
          type: object
          allOf:
            - $ref: "#/components/schemas/AssignmentState"
          nullable: true
        status:
          $ref: "#/components/schemas/InstanceStatus"
        startedAt:
          type: string
          format: date-time
        startedBy:
          type: string
        currentStepEnteredAt:
          type: string
          format: date-time
      required: [instanceId, processId, version, definitionHash, currentStepId, transitionSeq, data, status, startedAt]

    ResolvedViewField:
      type: object
      properties:
        field:
          type: object
          description: The field's catalog definition (see `src/schema/definition.ts`'s `fieldDef`).
        value:
          description: The field's current value, or absent.
        required:
          type: boolean
        readonly:
          type: boolean
        group:
          type: string
        options:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              label:
                type: object
                additionalProperties:
                  type: string
              attributes:
                type: object
                description: >-
                  The extra columns this option's data-list row carries, in the
                  order the operator declared them. Absent when the row carries
                  none. A value is a string, a number or a boolean.
                additionalProperties:
                  oneOf:
                    - type: string
                    - type: number
                    - type: boolean
      required: [field, required, readonly]

    AvailablePath:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        label:
          type: string
      required: [id, key]

    InstanceView:
      type: object
      properties:
        instanceId:
          type: string
        processId:
          type: string
        version:
          type: integer
        status:
          $ref: "#/components/schemas/InstanceStatus"
        step:
          type: object
          properties:
            id:
              type: string
            key:
              type: string
            label:
              $ref: "#/components/schemas/LocalizedText"
            type:
              type: string
          required: [id, key, label, type]
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedViewField"
        availablePaths:
          type: array
          items:
            $ref: "#/components/schemas/AvailablePath"
      required: [instanceId, processId, version, status, step, fields, availablePaths]

    InstanceSummary:
      type: object
      properties:
        instanceId:
          type: string
        processId:
          type: string
        version:
          type: integer
        status:
          $ref: "#/components/schemas/InstanceStatus"
        currentStepId:
          type: string
        transitionSeq:
          type: integer
        assignment:
          type: object
          allOf:
            - $ref: "#/components/schemas/AssignmentState"
          nullable: true
        startedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        currentStepEnteredAt:
          type: string
          format: date-time
        processLabel:
          $ref: "#/components/schemas/LocalizedText"
        stepLabel:
          $ref: "#/components/schemas/LocalizedText"
        processBaseLocale:
          type: string
      required: [instanceId, processId, version, status, currentStepId, transitionSeq, createdAt, processLabel, stepLabel, processBaseLocale]

    DegradedInstanceSummary:
      description: >-
        Stands in for an InstanceSummary the engine could not resolve —
        its pinned (processId, version) has no published body, or its
        currentStepId is absent from that body's steps. Only appears when
        the request is authorized to see every instance (scope=all); a
        scope=mine request never returns one for a caller's own instance,
        it is simply absent from items instead.
      type: object
      properties:
        degraded:
          type: boolean
          enum: [true]
        instanceId:
          type: string
        processId:
          type: string
        version:
          type: integer
        status:
          $ref: "#/components/schemas/InstanceStatus"
        currentStepId:
          type: string
        transitionSeq:
          type: integer
        startedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        reason:
          type: string
          enum: [missing-definition, current-step-not-in-body]
      required: [degraded, instanceId, processId, version, status, currentStepId, transitionSeq, createdAt, reason]

    InstanceSummaryPage:
      type: object
      properties:
        items:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/InstanceSummary"
              - $ref: "#/components/schemas/DegradedInstanceSummary"
        cursor:
          type: string
      required: [items]

    InstanceComment:
      type: object
      properties:
        id:
          type: string
        instanceId:
          type: string
        actorId:
          type: string
        text:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, instanceId, actorId, text, createdAt]

    InstanceCommentPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InstanceComment"
        cursor:
          type: string
      required: [items]

    AttachmentUploadRequest:
      type: object
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          minLength: 1
          maxLength: 255
        dataBase64:
          type: string
          minLength: 1
          description: The file's bytes, base64-encoded.
      required: [filename, contentType, dataBase64]

    InstanceAttachment:
      type: object
      description: Metadata only — never the file's bytes.
      properties:
        id:
          type: string
        instanceId:
          type: string
        actorId:
          type: string
        filename:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, instanceId, actorId, filename, contentType, sizeBytes, createdAt]

    InstanceAttachmentPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InstanceAttachment"
        cursor:
          type: string
      required: [items]

    InstanceRecordElement:
      type: object
      description: >-
        A `HistoryEntry` (`kind` is `transition`) or an `InstanceEvent`
        (`kind` is `event`). See CLAUDE.md's "Runtime record" section.
      properties:
        kind:
          type: string
          enum: [transition, event]
        entry:
          type: object
          description: Present when `kind` is `transition`.
        event:
          type: object
          description: Present when `kind` is `event`.
      required: [kind]

    InstanceRecordPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InstanceRecordElement"
        cursor:
          type: string
      required: [items]

    ProcessSummary:
      type: object
      properties:
        processId:
          type: string
        version:
          type: integer
        definitionHash:
          type: string
        status:
          type: string
        publishedAt:
          type: string
          format: date-time
        key:
          type: string
        label:
          $ref: "#/components/schemas/LocalizedText"
        baseLocale:
          type: string
      required: [processId, version, definitionHash, status, publishedAt, key, label, baseLocale]

    VersionSummary:
      type: object
      properties:
        version:
          type: integer
        definitionHash:
          type: string
        status:
          type: string
        publishedAt:
          type: string
          format: date-time
      required: [version, definitionHash, status, publishedAt]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    LoginActor:
      type: object
      description: >-
        The logged-in account as `POST /auth/login` reports it. Distinct from
        `Actor`, the authorization identity a resolver produces per request:
        this one carries a display name, `Actor` does not.
      properties:
        id:
          type: string
        roles:
          type: array
          items:
            type: string
        displayName:
          type: string
          description: The account's `display_name`, or its `email` when that column is null. Never empty.
      required: [id, roles, displayName]

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: 'An 8-hour token whose `iss` claim is `"bps"`.'
        expiresAt:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/LoginActor"
      required: [token, expiresAt, actor]

    LocalAccount:
      type: object
      description: >-
        The caller's own account, as `GET`/`PATCH /account/me` report it for
        an actor backed by a local account. `email`, `roles` and
        `managerUserId` are read-only here; the operator's own `admin/*`
        routes are what change them.
      properties:
        id:
          type: string
          description: The resolved actor's id, equal to the account's `user_id`.
        displayName:
          type: string
          description: The stored name, or the email when no name is stored. Never empty.
        storedDisplayName:
          type: string
          nullable: true
          description: >-
            The raw stored name, `null` where the account set none. An
            editable name control seeds from this, never from `displayName`:
            that one carries the email for an account with no name, and a
            save would then store the email as the name.
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        managerUserId:
          type: string
          description: The account's manager. Absent where none is on record.
        locale:
          type: string
          description: The account's own UI locale. Absent where the account never set one.
          enum: [en, de]
        editable:
          type: boolean
          enum: [true]
      required: [id, displayName, storedDisplayName, email, roles, editable]

    FederatedAccount:
      type: object
      description: >-
        What `GET /account/me` reports for a resolvable actor the engine
        holds no local account for. It carries the identity alone: no
        `displayName`, `storedDisplayName`, `email`, `managerUserId` or
        `locale`.
      properties:
        id:
          type: string
        roles:
          type: array
          items:
            type: string
        editable:
          type: boolean
          enum: [false]
      required: [id, roles, editable]

    AccountUpdate:
      type: object
      description: >-
        Both fields are optional and an omitted one is left as it stands.
        Any other key is refused with `400`.
      properties:
        displayName:
          type: string
          nullable: true
          maxLength: 200
          description: Trimmed before storage. `null` clears the stored name; a value that is empty after trimming is refused.
        locale:
          type: string
          enum: [en, de]
      additionalProperties: false

    PublishRequest:
      type: object
      properties:
        processId:
          type: string
          description: The caller decides identity — the same `processId` across two calls is a new version of one process.
        body:
          type: object
          description: A `ProcessBody` (see `src/schema/definition.ts`), validated server-side against the server's own registry.
      required: [processId, body]

    PublishResponse:
      type: object
      properties:
        processId:
          type: string
        version:
          type: integer
        definitionHash:
          type: string
        status:
          type: string
      required: [processId, version, definitionHash, status]

    CreateInstanceRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
          description: Omit for the latest published version.
        data:
          type: object
          additionalProperties: true
          description: Seed values for the initial step's fields.

    SubmitRequest:
      type: object
      properties:
        pathId:
          type: string
        data:
          type: object
          additionalProperties: true
          default: {}
      required: [pathId]

    DelegateRequest:
      type: object
      properties:
        toActorId:
          type: string
          minLength: 1
      required: [toActorId]

    CommentRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 10000
      required: [text]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, unavailable]
      required: [status]

    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            type:
              type: string
            message:
              type: string
          required: [type]
      required: [error]

    IssuesErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            type:
              type: string
            issues:
              type: array
              items:
                type: object
          required: [type, issues]
      required: [error]
