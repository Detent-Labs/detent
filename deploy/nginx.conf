# Serves the one browser bundle. Replaces the base image's own default
# server block entirely, so every directive below is load-bearing -- none
# of it is an implied default once this file takes over.
server {
    # nginxinc/nginx-unprivileged's own convention: its non-root user
    # cannot bind a port under 1024, so this is not just a style choice.
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;

    # The four headers `frontend-security-headers` names. A browser ignores
    # frame-ancestors in the bundle's <meta http-equiv> policy, so the shell
    # is unframeable only if it arrives here. `always` extends each one to a
    # non-2xx: try_files answers every unmatched path with index.html, so the
    # reachable one is the 405 a POST to a static path returns.
    #
    # nginx replaces this set, it does not merge it: a level's add_header
    # directives reach a nested block only while that block declares none of
    # its own. One add_header inside `location /` therefore removes all four.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # SPA fallback: the shell routes client-side via a hand-written History
    # API hook, so a direct load of a deep URL (for example
    # /studio/processes/abc/edit) must still resolve to index.html. The area
    # prefixes need no location block of their own -- one fallback covers
    # /app, /admin, /studio and /reporting alike.
    location / {
        try_files $uri /index.html;
    }
}
